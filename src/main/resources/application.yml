spring:
  profiles:
    active: dev
  data:
    mongodb:
      auto-index-creation: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:farmToCloudSuperSecretKeyThatIsLongEnoughForHS256Algorithm2024}
    expiration-ms: 86400000
  mail:
    from: ${GMAIL_USERNAME}
    from-name: Farm To Cloud Kitchen