spring:
  profiles:
    active: dev
  data:
    mongodb:
      auto-index-creation: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:farmToCloudSuperSecretKeyThatIsLongEnoughForHS256Algorithm2024}
    expiration-ms: 86400000
  brevo:
    api-key: ${BREVO_API_KEY}
  mail:
    from: ${MAIL_FROM_ADDRESS}
    from-name: Farm To Cloud Kitchen