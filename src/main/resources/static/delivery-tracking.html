<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Tracking — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="flex-between mb-6">
            <h1 style="font-size:28px; font-weight:800;">🚚 Delivery Tracking</h1>
            <a href="javascript:history.back()" class="btn btn-sm btn-outline">← Back</a>
        </div>

        <div class="glass-card mb-6" style="max-width:600px;">
            <div class="form-group">
                <label>Enter Order ID to Track</label>
                <div style="display:flex; gap:12px;">
                    <input type="text" id="trackOrderId" class="form-control" placeholder="Paste order ID">
                    <button onclick="trackOrder()" class="btn btn-primary">Track</button>
                </div>
            </div>
        </div>

        <div id="trackingResult"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'unauthorized';

        // Pre-fill from URL
        const urlOrderId = new URLSearchParams(window.location.search).get('orderId');
        if (urlOrderId) {
            document.getElementById('trackOrderId').value = urlOrderId;
            trackOrder();
        }

        async function trackOrder() {
            const orderId = document.getElementById('trackOrderId').value.trim();
            if (!orderId) { showToast('Enter an order ID', 'error'); return; }

            try {
                const orderRes = await apiGet(`/api/orders/${orderId}`);
                const order = orderRes.data;

                let deliveryHtml = '<p class="text-muted mt-4">No delivery assignment yet.</p>';
                try {
                    const delRes = await apiGet(`/api/delivery/order/${orderId}`);
                    const d = delRes.data;
                    deliveryHtml = `
                        <div class="mt-6">
                            <h3 class="section-title">🚛 Delivery Partner</h3>
                            <div class="grid-2">
                                <div><span class="text-muted">Name:</span> <strong>${d.partnerName}</strong></div>
                                <div><span class="text-muted">Phone:</span> <strong>${d.partnerPhone || '—'}</strong></div>
                                <div><span class="text-muted">Status:</span> ${getStatusBadge(d.status)}</div>
                                <div><span class="text-muted">Assigned:</span> ${formatDateTime(d.assignedAt)}</div>
                                ${d.pickupTime ? `<div><span class="text-muted">Picked Up:</span> ${formatDateTime(d.pickupTime)}</div>` : ''}
                                ${d.deliveryTime ? `<div><span class="text-muted">Delivered:</span> ${formatDateTime(d.deliveryTime)}</div>` : ''}
                            </div>
                        </div>
                    `;
                } catch(e) {}

                document.getElementById('trackingResult').innerHTML = `
                    <div class="glass-card" style="max-width:700px;">
                        <h2 style="font-size:20px; font-weight:700; margin-bottom:4px;">${order.cropName}</h2>
                        <p class="text-muted">${order.quantity} kg • ${formatCurrency(order.totalPrice)}</p>

                        <div class="mt-4">
                            ${renderStatusTimeline(order.status)}
                        </div>

                        <div class="grid-2 mt-4">
                            <div><span class="text-muted">Farmer:</span> ${order.farmerName || '—'}</div>
                            <div><span class="text-muted">Kitchen:</span> ${order.kitchenName || '—'}</div>
                            <div><span class="text-muted">Order Date:</span> ${formatDateTime(order.createdAt)}</div>
                            <div><span class="text-muted">Current Status:</span> ${getStatusBadge(order.status)}</div>
                        </div>

                        ${deliveryHtml}

                        <div class="mt-6">
                            <a href="/order-detail.html?id=${orderId}" class="btn btn-sm btn-outline">View Full Details →</a>
                        </div>
                    </div>
                `;
            } catch(e) { showToast('Order not found: ' + e.message, 'error'); }
        }
    </script>
</body>
</html>
