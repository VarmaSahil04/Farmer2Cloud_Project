<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disputes — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <h1 style="font-size:28px; font-weight:800; margin-bottom:24px;">🛡️ Dispute Resolution Center</h1>

        <!-- Raise Dispute -->
        <div class="glass-card mb-6" style="max-width:600px;">
            <h2 class="section-title">Raise a New Dispute</h2>
            <form id="disputeForm">
                <div class="form-group">
                    <label for="orderId">Order ID</label>
                    <input type="text" id="orderId" class="form-control" placeholder="Paste the order ID" required>
                </div>
                <div class="form-group">
                    <label for="reason">Reason</label>
                    <select id="reason" class="form-control" required>
                        <option value="">Select reason</option>
                        <option value="Weight mismatch">⚖️ Weight mismatch</option>
                        <option value="Quality issue">🍅 Quality issue</option>
                        <option value="Late delivery">🕐 Late delivery</option>
                        <option value="Wrong product">❌ Wrong product</option>
                        <option value="Payment issue">💰 Payment issue</option>
                        <option value="Other">📝 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="comment">Description</label>
                    <textarea id="comment" class="form-control" rows="3" placeholder="Describe the issue in detail..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="imageUrl">Evidence Image URL (optional)</label>
                    <input type="text" id="imageUrl" class="form-control" placeholder="Paste image URL">
                </div>
                <button type="submit" class="btn btn-danger" style="width:100%;">🛡️ Submit Dispute</button>
            </form>
        </div>

        <!-- My Disputes -->
        <div class="glass-card">
            <h2 class="section-title">📋 My Disputes</h2>
            <div id="disputesList"><p class="text-muted">Loading...</p></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'unauthorized';

        // Pre-fill orderId from URL if present
        const urlOrderId = new URLSearchParams(window.location.search).get('orderId');
        if (urlOrderId) document.getElementById('orderId').value = urlOrderId;

        async function loadDisputes() {
            try {
                const res = await apiGet('/api/disputes/my');
                const disputes = res.data || [];
                const el = document.getElementById('disputesList');
                if (!disputes.length) { el.innerHTML = '<p class="text-muted">No disputes raised. We hope everything is going well! 🎉</p>'; return; }

                el.innerHTML = `<table class="data-table"><thead><tr><th>Order</th><th>Reason</th><th>Status</th><th>Raised</th><th>Resolution</th></tr></thead><tbody>` +
                    disputes.map(d => `<tr>
                        <td><a href="/order-detail.html?id=${d.orderId}" style="color:var(--primary);">${d.orderId.substring(0,8)}...</a></td>
                        <td>${d.reason}</td>
                        <td>${getStatusBadge(d.status)}</td>
                        <td>${formatDateTime(d.createdAt)}</td>
                        <td>${d.resolution || '<span class="text-muted">Pending</span>'}</td>
                    </tr>`).join('') + '</tbody></table>';
            } catch(e) { showToast(e.message, 'error'); }
        }

        document.getElementById('disputeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await apiPost('/api/disputes', {
                    orderId: document.getElementById('orderId').value,
                    reason: document.getElementById('reason').value,
                    comment: document.getElementById('comment').value,
                    imageUrl: document.getElementById('imageUrl').value
                });
                showToast('Dispute raised successfully!');
                document.getElementById('disputeForm').reset();
                loadDisputes();
            } catch(err) { showToast(err.message, 'error'); }
        });

        loadDisputes();
    </script>
</body>
</html>
