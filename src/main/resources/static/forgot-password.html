<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--gradient-hero);">
        <div class="glass-card" style="max-width:440px; width:90%; padding:40px;">
            <div class="text-center mb-6">
                <div style="font-size:40px; margin-bottom:8px;">🔑</div>
                <h1 style="font-size:28px; font-weight:800;">Forgot Password?</h1>
                <p class="text-muted mt-2" style="font-size:14px;">Enter your email and we'll send you a reset code.</p>
            </div>

            <form id="forgotForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="submitBtn">
                    Send Reset Code &rarr;
                </button>
            </form>

            <p class="text-center mt-4 text-muted" style="font-size:14px;">
                Remembered it? <a href="/login.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Back to Login</a>
            </p>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                await apiPost('/api/auth/forgot-password', {
                    email: document.getElementById('email').value
                });
            } catch (err) {
                // Backend always returns 200 success — swallow any unexpected error silently
                console.error('Forgot password error:', err);
            }

            // Always show success (backend avoids leaking whether the email exists)
            showToast('If that email is registered, a reset code has been sent.');
            setTimeout(() => window.location.href = '/reset-password.html', 1200);
        });
    </script>
</body>
</html>
