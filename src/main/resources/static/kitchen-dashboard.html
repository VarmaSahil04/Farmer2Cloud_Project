<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Dashboard — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="flex-between mb-6">
            <div>
                <h1 style="font-size:28px; font-weight:800;">🍽️ Kitchen Dashboard</h1>
                <p class="text-muted" id="welcomeMsg">Welcome back!</p>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid-3 mb-6">
            <div class="stat-card"><div class="stat-icon" style="background:var(--gradient-1);">📦</div><div><div class="stat-value" id="totalOrders">—</div><div class="stat-label">Total Orders</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:var(--gradient-2);">🌾</div><div><div class="stat-value" id="availableCrops">—</div><div class="stat-label">Available Crops</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:var(--gradient-3);">💰</div><div><div class="stat-value" id="totalSpent">—</div><div class="stat-label">Total Spent</div></div></div>
        </div>

        <!-- Recommendations -->
        <div class="glass-card mb-6">
            <h2 class="section-title">🧠 Recommended for You</h2>
            <div id="recommendations" class="grid-3"><p class="text-muted">Loading...</p></div>
        </div>

        <!-- Browse Crops -->
        <div class="glass-card mb-6" id="browse">
            <h2 class="section-title">🌾 Browse Available Crops</h2>
            <div style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap;">
                <input type="text" id="searchInput" class="form-control" placeholder="Search crops..." style="max-width:250px;">
                <input type="number" id="minPrice" class="form-control" placeholder="Min ₹/kg" style="max-width:120px;">
                <input type="number" id="maxPrice" class="form-control" placeholder="Max ₹/kg" style="max-width:120px;">
                <button onclick="searchCrops()" class="btn btn-sm btn-primary">🔍 Search</button>
                <button onclick="loadCrops()" class="btn btn-sm btn-outline">Reset</button>
            </div>
            <div id="cropBrowser"><p class="text-muted">Loading...</p></div>
        </div>

        <!-- My Orders -->
        <div class="glass-card mb-6">
            <h2 class="section-title">📋 My Orders</h2>
            <div id="ordersList"><p class="text-muted">Loading...</p></div>
        </div>
    </div>

    <!-- Order Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="flex-between mb-4">
                <h3 style="font-size:18px; font-weight:700;">Place Order</h3>
                <button onclick="closeModal()" class="btn btn-sm" style="background:var(--dark-border);">✕</button>
            </div>
            <div id="orderModalBody"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!requireRole('KITCHEN')) throw 'unauthorized';

        async function loadDashboard() {
            try {
                const res = await apiGet('/api/kitchen/dashboard');
                const d = res.data;

                document.getElementById('welcomeMsg').textContent = `Welcome, ${d.kitchen.businessName || d.kitchen.name}!`;
                document.getElementById('totalOrders').textContent = d.totalOrders || 0;
                document.getElementById('availableCrops').textContent = (d.availableCrops || []).length;

                const totalSpent = (d.payments || []).filter(p => p.status === 'PAID').reduce((s, p) => s + p.amount, 0);
                document.getElementById('totalSpent').textContent = formatCurrency(totalSpent);

                renderRecommendations(d.recommendations || []);
                renderOrders(d.orders || []);
            } catch(e) { showToast('Dashboard error: ' + e.message, 'error'); }
        }

        function renderRecommendations(recs) {
            const el = document.getElementById('recommendations');
            if (!recs.length) { el.innerHTML = '<p class="text-muted">Order some crops first to get personalized recommendations!</p>'; return; }
            el.innerHTML = recs.map(r => `
                <div class="glass-card" style="cursor:pointer;" onclick="document.getElementById('searchInput').value='${r.cropName}'; searchCrops();">
                    <div style="font-size:24px;">${r.type === 'TRENDING' ? '🔥' : '🔄'}</div>
                    <div style="font-weight:700; margin-top:4px; text-transform:capitalize;">${r.cropName}</div>
                    <div class="text-muted" style="font-size:12px;">${r.reason}</div>
                    ${r.avgPrice ? `<div class="text-primary" style="font-size:13px; margin-top:4px;">Avg: ${formatCurrency(r.avgPrice)}/kg</div>` : ''}
                </div>
            `).join('');
        }

        async function loadCrops() {
            try {
                const res = await apiGet('/api/kitchen/browse');
                renderCrops(res.data || []);
            } catch(e) { showToast(e.message, 'error'); }
        }

        async function searchCrops() {
            const search = document.getElementById('searchInput').value;
            const min = document.getElementById('minPrice').value;
            const max = document.getElementById('maxPrice').value;

            let url = '/api/kitchen/browse?';
            if (search) url += `search=${search}&`;
            if (min && max) url += `minPrice=${min}&maxPrice=${max}&`;

            try {
                const res = await apiGet(url);
                renderCrops(res.data || []);
            } catch(e) { showToast(e.message, 'error'); }
        }

        function renderCrops(crops) {
            const el = document.getElementById('cropBrowser');
            if (!crops.length) { el.innerHTML = '<p class="text-muted">No crops found matching your criteria.</p>'; return; }

            el.innerHTML = `<table class="data-table"><thead><tr><th>Crop</th><th>Farmer</th><th>Location</th><th>Qty</th><th>Price/kg</th><th>Market</th><th>Fair Price</th><th>Demand</th><th>Action</th></tr></thead><tbody>` +
                crops.map(c => `<tr>
                    <td><strong>${c.cropName}</strong></td>
                    <td>${c.farmerName || '—'}</td>
                    <td>${c.farmerLocation || '—'}</td>
                    <td>${c.quantity} kg</td>
                    <td>${formatCurrency(c.pricePerKg)}</td>
                    <td class="text-muted">${formatCurrency(c.marketPrice)}</td>
                    <td style="color:var(--primary); font-weight:600;">${formatCurrency(c.suggestedFairPrice)}</td>
                    <td>${getDemandEmoji(c.demandLevel)} ${c.demandLevel}</td>
                    <td><button class="btn btn-sm btn-primary" onclick="openOrderModal('${c.id}', '${c.cropName}', ${c.pricePerKg}, ${c.quantity})">🛒 Order</button></td>
                </tr>`).join('') + '</tbody></table>';
        }

        function openOrderModal(cropId, cropName, price, maxQty) {
            document.getElementById('orderModalBody').innerHTML = `
                <div class="mb-4">
                    <div style="font-size:20px; font-weight:700;">${cropName}</div>
                    <div class="text-muted">Price: ${formatCurrency(price)}/kg • Available: ${maxQty} kg</div>
                </div>
                <div class="form-group">
                    <label>Quantity (kg)</label>
                    <input type="number" id="orderQty" class="form-control" placeholder="Enter quantity" min="1" max="${maxQty}" required>
                </div>
                <div id="orderTotal" class="mb-4 text-primary" style="font-size:18px; font-weight:700;"></div>
                <button onclick="placeOrder('${cropId}')" class="btn btn-primary" style="width:100%;">Place Order</button>
            `;
            document.getElementById('orderQty').addEventListener('input', (e) => {
                const total = (e.target.value || 0) * price;
                document.getElementById('orderTotal').textContent = 'Total: ' + formatCurrency(total);
            });
            document.getElementById('orderModal').classList.add('active');
        }

        function closeModal() { document.getElementById('orderModal').classList.remove('active'); }

        async function placeOrder(cropId) {
            const qty = parseFloat(document.getElementById('orderQty').value);
            if (!qty || qty <= 0) { showToast('Enter valid quantity', 'error'); return; }
            try {
                await apiPost('/api/orders', { cropListingId: cropId, quantity: qty });
                showToast('Order placed successfully! Confirmation email sent.');
                closeModal();
                loadDashboard();
                loadCrops();
            } catch(e) { showToast(e.message, 'error'); }
        }

        function renderOrders(orders) {
            const el = document.getElementById('ordersList');
            if (!orders.length) { el.innerHTML = '<p class="text-muted">No orders yet. Browse and order crops above!</p>'; return; }
            el.innerHTML = `<table class="data-table"><thead><tr><th>Crop</th><th>Farmer</th><th>Qty</th><th>Total</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>` +
                orders.map(o => `<tr>
                    <td>${o.cropName}</td>
                    <td>${o.farmerName || '—'}</td>
                    <td>${o.quantity} kg</td>
                    <td>${formatCurrency(o.totalPrice)}</td>
                    <td>${getStatusBadge(o.status)}</td>
                    <td>${formatDateTime(o.createdAt)}</td>
                    <td>
                        <a href="/order-detail.html?id=${o.id}" class="btn btn-sm btn-outline">View</a>
                        ${o.status === 'DELIVERED' ? `<button class="btn btn-sm btn-primary" onclick="settlePayment('${o.id}')" style="margin-left:4px;">💰 Pay</button>` : ''}
                    </td>
                </tr>`).join('') + '</tbody></table>';
        }

        async function settlePayment(orderId) {
            try {
                await apiPost(`/api/payments/settle/${orderId}`, {});
                showToast('Payment settled!');
                loadDashboard();
            } catch(e) { showToast(e.message, 'error'); }
        }

        loadDashboard();
        loadCrops();
    </script>
</body>
</html>
