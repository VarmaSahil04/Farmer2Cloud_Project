<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--gradient-hero);">
        <div class="glass-card" style="max-width:440px; width:90%; padding:40px;">
            <div class="text-center mb-6">
                <div style="font-size:40px; margin-bottom:8px;">🔒</div>
                <h1 style="font-size:28px; font-weight:800;">Reset Password</h1>
                <p class="text-muted mt-2" style="font-size:14px;">Enter the code from your email and choose a new password.</p>
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="token">Reset Code</label>
                    <input type="text" id="token" class="form-control" placeholder="Paste the code from your email" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="resetBtn">
                    Reset Password &rarr;
                </button>
            </form>

            <p class="text-center mt-4 text-muted" style="font-size:14px;">
                Need a new code? <a href="/forgot-password.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Request again</a>
            </p>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('resetBtn');
            const password = document.getElementById('newPassword').value;

            // Client-side validation: block if password shorter than 6 chars
            if (password.length < 6) {
                showToast('Password must be at least 6 characters.', 'error');
                return;
            }

            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                await apiPost('/api/auth/reset-password', {
                    token: document.getElementById('token').value.trim(),
                    newPassword: password
                });
                showToast('Password reset successful! Please log in.');
                setTimeout(() => window.location.href = '/login.html', 1200);
            } catch (err) {
                // Surface exact backend message (e.g. "Reset token has expired...")
                showToast(err.message, 'error');
                btn.textContent = 'Reset Password →';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
