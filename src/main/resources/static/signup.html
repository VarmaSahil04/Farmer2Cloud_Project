<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--gradient-hero); padding:80px 0;">
        <div class="glass-card" style="max-width:520px; width:90%; padding:40px;">
            <div class="text-center mb-6">
                <div style="font-size:40px; margin-bottom:8px;">🚀</div>
                <h1 style="font-size:28px; font-weight:800;">Create Account</h1>
                <p class="text-muted mt-2" style="font-size:14px;">Join the FarmToCloud platform</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="role">I am a</label>
                    <select id="role" class="form-control" required>
                        <option value="">Select your role</option>
                        <option value="FARMER">👨‍🌾 Farmer</option>
                        <option value="KITCHEN">🍽️ Cloud Kitchen</option>
                        <option value="DELIVERY">🚚 Delivery Partner</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" class="form-control" placeholder="Your name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" placeholder="+91 9876543210">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>

                <!-- Farmer Fields -->
                <div id="farmerFields" style="display:none;">
                    <div class="form-group">
                        <label for="location">Location / Village</label>
                        <input type="text" id="location" class="form-control" placeholder="e.g., Nashik, Maharashtra">
                    </div>
                    <div class="form-group">
                        <label for="cropTypes">Crop Types (comma separated)</label>
                        <input type="text" id="cropTypes" class="form-control" placeholder="e.g., Tomato, Onion, Potato">
                    </div>
                    <div class="form-group">
                        <label for="upiId">UPI ID</label>
                        <input type="text" id="upiId" class="form-control" placeholder="yourname@upi">
                    </div>
                </div>

                <!-- Kitchen Fields -->
                <div id="kitchenFields" style="display:none;">
                    <div class="form-group">
                        <label for="businessName">Business Name</label>
                        <input type="text" id="businessName" class="form-control" placeholder="Your kitchen name">
                    </div>
                    <div class="form-group">
                        <label for="address">Business Address</label>
                        <input type="text" id="address" class="form-control" placeholder="Full address">
                    </div>
                    <div class="form-group">
                        <label for="dailyRequirements">Daily Requirements</label>
                        <input type="text" id="dailyRequirements" class="form-control" placeholder="e.g., 50kg tomatoes, 30kg onions">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;" id="signupBtn">
                    Create Account →
                </button>
            </form>

            <p class="text-center mt-4 text-muted" style="font-size:14px;">
                Already have an account? <a href="/login.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Login</a>
            </p>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        // Pre-select role from URL param
        const urlParams = new URLSearchParams(window.location.search);
        const preRole = urlParams.get('role');
        if (preRole) {
            document.getElementById('role').value = preRole;
            toggleRoleFields(preRole);
        }

        document.getElementById('role').addEventListener('change', (e) => toggleRoleFields(e.target.value));

        function toggleRoleFields(role) {
            document.getElementById('farmerFields').style.display = role === 'FARMER' ? 'block' : 'none';
            document.getElementById('kitchenFields').style.display = role === 'KITCHEN' ? 'block' : 'none';
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.textContent = 'Creating...';
            btn.disabled = true;

            const role = document.getElementById('role').value;
            const body = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                password: document.getElementById('password').value,
                role: role
            };

            if (role === 'FARMER') {
                body.location = document.getElementById('location').value;
                body.cropTypes = document.getElementById('cropTypes').value.split(',').map(c => c.trim()).filter(c => c);
                body.upiId = document.getElementById('upiId').value;
            } else {
                body.businessName = document.getElementById('businessName').value;
                body.address = document.getElementById('address').value;
                body.dailyRequirements = document.getElementById('dailyRequirements').value;
            }

            try {
                await apiPost('/api/auth/signup', body);
                showToast('Account created! Please login. Check your email for a welcome message.');
                setTimeout(() => window.location.href = '/login.html', 1000);
            } catch (err) {
                showToast(err.message, 'error');
                btn.textContent = 'Create Account →';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
