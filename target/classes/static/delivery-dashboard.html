<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Partner Dashboard — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <div class="flex-between mb-6">
            <div>
                <h1 style="font-size:28px; font-weight:800;">🚚 Delivery Dashboard</h1>
                <p class="text-muted" id="welcomeMsg">Welcome back, Partner!</p>
            </div>
            <a href="/delivery-tracking.html" class="btn btn-primary">Track Any Order</a>
        </div>

        <div class="glass-card mb-6">
            <h2 class="section-title">📦 Available Pickups & Active Deliveries</h2>
            <div id="ordersList"><p class="text-muted">Loading assigned deliveries...</p></div>
        </div>
    </div>

    <!-- Order Modal for minor details (optional) -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div class="flex-between mb-4">
                <h3 style="font-size:18px; font-weight:700;">Order Details</h3>
                <button onclick="closeModal()" class="btn btn-sm" style="background:var(--dark-border);">✕</button>
            </div>
            <div id="orderModalBody"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!requireRole('DELIVERY')) throw 'unauthorized';

        async function loadDashboard() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (user) {
                    document.getElementById('welcomeMsg').textContent = `Welcome, ${user.name}!`;
                }

                const res = await apiGet('/api/orders/delivery');
                renderOrders(res.data || []);
            } catch (err) {
                showToast('Failed to load dashboard: ' + err.message, 'error');
            }
        }

        function renderOrders(orders) {
            const el = document.getElementById('ordersList');
            if (!orders.length) { el.innerHTML = '<p class="text-muted">No active deliveries pending. Check back later!</p>'; return; }

            el.innerHTML = `<table class="data-table"><thead><tr><th>Crop</th><th>Farmer</th><th>Kitchen</th><th>Qty</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>` +
                orders.map(o => {
                    let actionBtn = '';
                    if (o.status === 'PICKUP_ASSIGNED') {
                        actionBtn = `<a href="/verification.html?orderId=${o.id}" class="btn btn-sm btn-primary">📸 Verify Pickup</a>`;
                    } else if (o.status === 'FARMER_CONFIRMED') {
                        actionBtn = `<button class="btn btn-sm btn-primary" onclick="updateStatus('${o.id}', 'IN_TRANSIT')">🚚 Start Transit</button>`;
                    } else if (o.status === 'IN_TRANSIT') {
                        actionBtn = `<button class="btn btn-sm btn-primary" onclick="updateStatus('${o.id}', 'DELIVERED')">📦 Mark Delivered</button>`;
                    } else if (o.status === 'VERIFIED') {
                        actionBtn = `<span class="text-muted" style="font-size:12px;">Waiting for Farmer Confirm</span>`;
                    }

                    return `<tr>
                        <td><strong>${o.cropName}</strong></td>
                        <td>${o.farmerName || '—'}</td>
                        <td>${o.kitchenName || '—'}</td>
                        <td>${o.quantity} kg</td>
                        <td>${getStatusBadge(o.status)}</td>
                        <td>${formatDateTime(o.createdAt)}</td>
                        <td style="display:flex; gap:8px;">
                            ${actionBtn}
                            <a href="/order-detail.html?id=${o.id}" class="btn btn-sm btn-outline">Details</a>
                        </td>
                    </tr>`;
                }).join('') + '</tbody></table>';
        }

        async function updateStatus(orderId, newStatus) {
            try {
                await apiPut(`/api/orders/${orderId}/status`, { status: newStatus });
                showToast(`Order marked as ${newStatus}!`);
                loadDashboard();
            } catch(e) {
                showToast(e.message, 'error');
            }
        }

        function closeModal() { document.getElementById('orderModal').classList.remove('active'); }

        loadDashboard();
    </script>
</body>
</html>
