<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--gradient-hero);">
        <div class="glass-card" style="max-width:440px; width:90%; padding:40px;">
            <div class="text-center mb-6">
                <div style="font-size:40px; margin-bottom:8px;">🔐</div>
                <h1 style="font-size:28px; font-weight:800;">Welcome Back</h1>
                <p class="text-muted mt-2" style="font-size:14px;">Login to your FarmToCloud account</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">
                    Login →
                </button>
            </form>

            <p class="text-center mt-4 text-muted" style="font-size:14px;">
                Don't have an account? <a href="/signup.html" style="color:var(--primary); text-decoration:none; font-weight:600;">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            try {
                const res = await apiPost('/api/auth/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                const data = res.data;
                setAuth(data.token, { id: data.userId, name: data.name, email: data.email, role: data.role });
                showToast('Login successful!');
                setTimeout(() => {
                    if (data.role === 'FARMER') window.location.href = '/farmer-dashboard.html';
                    else if (data.role === 'DELIVERY') window.location.href = '/delivery-dashboard.html';
                    else window.location.href = '/kitchen-dashboard.html';
                }, 500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.textContent = 'Login →';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
