<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments — FarmToCloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar" id="navbar"></nav>

    <div class="page-wrapper">
        <h1 style="font-size:28px; font-weight:800; margin-bottom:24px;">💰 Payment History</h1>

        <!-- Payment Stats -->
        <div class="grid-3 mb-6">
            <div class="stat-card"><div class="stat-icon" style="background:var(--gradient-1);">✅</div><div><div class="stat-value" id="paidCount">—</div><div class="stat-label">Payments Completed</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:var(--gradient-2);">⏳</div><div><div class="stat-value" id="pendingCount">—</div><div class="stat-label">Pending</div></div></div>
            <div class="stat-card"><div class="stat-icon" style="background:var(--gradient-3);">💵</div><div><div class="stat-value" id="totalAmount">—</div><div class="stat-label">Total Amount</div></div></div>
        </div>

        <!-- Payment Table -->
        <div class="glass-card">
            <h2 class="section-title">📋 All Transactions</h2>
            <div id="paymentTable"><p class="text-muted">Loading...</p></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        if (!requireAuth()) throw 'unauthorized';
        const role = getUserRole();

        async function loadPayments() {
            try {
                const endpoint = role === 'FARMER' ? '/api/payments/farmer' : '/api/payments/kitchen';
                const res = await apiGet(endpoint);
                const payments = res.data || [];

                const paid = payments.filter(p => p.status === 'PAID');
                const pending = payments.filter(p => p.status === 'PENDING' || p.status === 'PROCESSING');
                const totalAmt = paid.reduce((s, p) => s + p.amount, 0);

                document.getElementById('paidCount').textContent = paid.length;
                document.getElementById('pendingCount').textContent = pending.length;
                document.getElementById('totalAmount').textContent = formatCurrency(totalAmt);

                const el = document.getElementById('paymentTable');
                if (!payments.length) { el.innerHTML = '<p class="text-muted">No payment records yet.</p>'; return; }

                el.innerHTML = `<table class="data-table"><thead><tr><th>Transaction ID</th><th>Order</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead><tbody>` +
                    payments.map(p => `<tr>
                        <td><code style="color:var(--primary);">${p.transactionId || '—'}</code></td>
                        <td><a href="/order-detail.html?id=${p.orderId}" style="color:var(--accent);">${p.orderId.substring(0,8)}...</a></td>
                        <td style="font-weight:700; font-size:16px;">${formatCurrency(p.amount)}</td>
                        <td>${p.paymentMethod || 'UPI'}</td>
                        <td>${getStatusBadge(p.status)}</td>
                        <td>${p.paidAt ? formatDateTime(p.paidAt) : '<span class="text-muted">Pending</span>'}</td>
                    </tr>`).join('') + '</tbody></table>';
            } catch(e) { showToast(e.message, 'error'); }
        }

        loadPayments();
    </script>
</body>
</html>
